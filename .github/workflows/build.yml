name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish releases on tags

env:
  # Signs desktop updates. Absent on forks/PRs, where signing is skipped.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
  # linuxdeploy is itself an AppImage; runners have no FUSE for it.
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: UI flows (headless Chrome, scripted mock API, real CSP)
        run: CHROME=google-chrome node test/ui/run.mjs

  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libfuse2t64 xdg-utils file
      - run: npm ci
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: AppImage, deb and rpm
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then extra="--config src-tauri/tauri.updater.conf.json"; fi
          npx tauri build --bundles appimage,deb,rpm $extra
      - name: Collect
        run: |
          mkdir dist-release
          b=src-tauri/target/release/bundle
          cp $b/appimage/*.AppImage* $b/deb/*.deb* $b/rpm/*.rpm* dist-release/
          scripts/sign_missing.sh dist-release
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist-release/

  windows:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          # WiX can't build ARM64 MSIs; NSIS can.
          - arch: arm64
            target: aarch64-pc-windows-msvc
            bundles: nsis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}
      - run: npm ci
      - name: Installers
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then extra="--config src-tauri/tauri.updater.conf.json"; fi
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} $extra
      - name: Collect
        shell: bash
        run: |
          mkdir dist-release
          b=src-tauri/target/${{ matrix.target }}/release/bundle
          cp $b/nsis/*-setup.exe* dist-release/
          if [ -d $b/msi ]; then cp $b/msi/*.msi* dist-release/; fi
          scripts/sign_missing.sh dist-release
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist-release/

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Universal app (Apple Silicon and Intel)
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then extra="--config src-tauri/tauri.updater.conf.json"; fi
          npx tauri build --target universal-apple-darwin --bundles app,dmg $extra
      - name: Collect
        run: |
          mkdir dist-release
          b=src-tauri/target/universal-apple-darwin/release/bundle
          cp $b/dmg/*.dmg dist-release/
          # The updater bundle has no version or arch in its name; give it one.
          for f in $b/macos/*.app.tar.gz*; do
            [ -e "$f" ] && cp "$f" "dist-release/$(basename "$f" | sed 's/\.app\.tar\.gz/_universal.app.tar.gz/')"
          done
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist-release/

  android:
    needs: test
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Android project
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          npx tauri icon src-tauri/app-icon.png
      - name: APK (phones, older phones, Chromebooks and emulators)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64 armv7 x86_64 --ci
      - name: Sign
        run: |
          mkdir dist-release
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          unsigned=$(find src-tauri/gen/android -name '*universal-release*.apk' | head -1)
          echo "built: $unsigned"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          out="dist-release/Formwright_${version}_android.apk"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > release.jks
            "$tools/apksigner" sign --v4-signing-enabled false --ks release.jks --ks-key-alias formwright --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out "$out" aligned.apk
            "$tools/apksigner" verify --print-certs "$out" | grep -i "sha-256"
            rm release.jks
          else
            cp aligned.apk "$out" # unsigned on forks; not installable
          fi
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist-release/

  web:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist-release
          merge-multiple: true
      - name: Updater manifest
        run: python3 scripts/latest_json.py "${GITHUB_REF_NAME}" dist-release > dist-release/latest.json && cat dist-release/latest.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-release/* --title "Formwright ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  # The browser version, for iPhone, iPad, Chromebooks and anything else.
  # Deployed from main (GitHub Pages only accepts the default branch), once
  # tests pass, so it is always the latest tested code.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
